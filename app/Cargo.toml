[package]
name = "lanfile"
version.workspace = true
edition.workspace = true

[lib]
path = "src/router.rs"

[lints]
workspace = true

[dependencies]
lanfile-assets = { path = "../assets" }
lanfile-list = { path = "../list" }
lanfile-sendfile = { path = "../sendfile" }
salvo = { workspace = true, features = ["server", "http1"] }
mimalloc = { version = "0.1.52", features = ["v2", "no_thp", "override"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { workspace = true, features = ["full"] }
chrono = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { workspace = true, features = ["time"] }

[dev-dependencies]
salvo = { workspace = true, features = ["test"] }
serde_json = "1.0.151"
