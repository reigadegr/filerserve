[package]
name = "lanfile-assets"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
lanfile-namedfile = { path = "../namedfile" }
lanfile-sendfile = { path = "../sendfile" }
salvo = { workspace = true, features = ["server", "serve-static"] }
mime = "0.3"
rust-embed = "8.12.0"
tokio = { version = "1.53.1", features = ["fs", "rt"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
