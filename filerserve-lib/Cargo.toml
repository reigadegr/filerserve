[package]
name = "filerserve-lib"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
salvo = { version = "0.96.0", default-features = false, features = [
  "server",
  "http1",
  "http2",
  "serve-static",
  "test",
] }
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
rust-embed = "8.12.0"

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
