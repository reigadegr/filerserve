[package]
name = "lanfile-namedfile"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
salvo = { workspace = true, features = ["server"] }
bytes = "1"
enumflags2 = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mime = "0.3"
mime-infer = "4"
percent-encoding = "2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "rt"] }
